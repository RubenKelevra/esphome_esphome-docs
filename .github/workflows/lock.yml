name: Lock

# Disabled on 2026-06-19 because this workflow was repeatedly failing.
# Restore the schedule and remove the job-level `if` guard to re-enable.
on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock

jobs:
  lock:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@7266a7ce5c1df01b1c6db85bf8cd86c737dadbe7 # v4
        with:
          pr-inactive-days: "1"
          pr-lock-reason: ""
          exclude-any-pr-labels: keep-open

          issue-inactive-days: "7"
          issue-lock-reason: ""
          exclude-any-issue-labels: keep-open
